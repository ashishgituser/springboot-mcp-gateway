name: Release

on:
  workflow_dispatch:
    inputs:
      auto_publish:
        description: "Publish immediately once validated, with no manual review step in the Central Portal. Irreversible once live - leave unchecked to land as a pending deployment you confirm by hand instead."
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy to Central Publisher Portal
        run: >
          mvn -B -ntp -Prelease deploy
          -DautoPublish=${{ inputs.auto_publish }}
          -DwaitUntil=${{ inputs.auto_publish && 'PUBLISHED' || 'VALIDATED' }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

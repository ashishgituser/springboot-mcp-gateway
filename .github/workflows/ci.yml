name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      # The starter is published against Boot 4 but supported on Boot 3, and a claim like that
      # rots unless something checks it. Boots the starter on Boot 3.5 and drives it end to end.
      - name: Spring Boot 3 compatibility
        run: |
          mvn -B -ntp install -DskipTests
          mvn -B -ntp -f compat/boot3/pom.xml compile exec:java

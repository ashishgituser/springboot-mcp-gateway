<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- clients -->
  <text x="500" y="34" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.4">AI AGENTS</text>
  <g fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="292" y="48" width="130" height="42" rx="8"/>
    <rect x="435" y="48" width="130" height="42" rx="8"/>
    <rect x="578" y="48" width="130" height="42" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#0f172a">
    <text x="357" y="75">Claude</text>
    <text x="500" y="75">Cursor</text>
    <text x="643" y="75">Your agent</text>
  </g>

  <path d="M 357 90 L 357 108 L 500 108 L 500 132" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 500 90 L 500 132" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 643 90 L 643 108 L 500 108 L 500 132" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="516" y="126" font-size="12" fill="#2563eb" font-weight="600">one MCP endpoint · /mcp</text>

  <!-- gateway -->
  <rect x="150" y="138" width="700" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="176" y="168" font-size="16" font-weight="700" fill="#1e3a8a">MCP Gateway</text>
  <text x="176" y="188" font-size="12.5" fill="#475569">Spring Boot starter, or its own container</text>

  <!-- pipeline -->
  <g>
    <rect x="176" y="206" width="122" height="58" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="237" y="230" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Identity</text>
    <text x="237" y="249" text-anchor="middle" font-size="11" fill="#64748b">via mcp-security</text>

    <rect x="316" y="206" width="122" height="58" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="377" y="230" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Authorization</text>
    <text x="377" y="249" text-anchor="middle" font-size="11" fill="#64748b">allow / deny rules</text>

    <rect x="456" y="206" width="122" height="58" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="517" y="230" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Quota</text>
    <text x="517" y="249" text-anchor="middle" font-size="11" fill="#64748b">memory or Redis</text>

    <rect x="596" y="206" width="122" height="58" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="657" y="230" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Routing</text>
    <text x="657" y="249" text-anchor="middle" font-size="11" fill="#64748b">namespaced names</text>

    <rect x="736" y="206" width="90" height="58" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="781" y="230" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Audit</text>
    <text x="781" y="249" text-anchor="middle" font-size="11" fill="#64748b">+ metrics</text>

    <g stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
      <path d="M 298 235 L 314 235"/>
      <path d="M 438 235 L 454 235"/>
      <path d="M 578 235 L 594 235"/>
      <path d="M 718 235 L 734 235"/>
    </g>
  </g>

  <!-- discovery callout -->
  <rect x="176" y="282" width="650" height="44" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="200" cy="304" r="8" fill="#22c55e"/>
  <path d="M 196 304 l 3 3 l 6 -7" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="218" y="300" font-size="12.5" font-weight="600" fill="#166534">Authorization-aware discovery</text>
  <text x="218" y="317" font-size="11.5" fill="#475569">tools/list, prompts/list and resources/list are filtered by the same rules that gate calls — a caller is never shown what it cannot invoke</text>

  <!-- primitives -->
  <text x="176" y="356" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="1.1">PROXIED</text>
  <g font-size="12" fill="#1e3a8a">
    <rect x="248" y="342" width="70" height="24" rx="12" fill="#dbeafe"/>
    <text x="283" y="358" text-anchor="middle">tools</text>
    <rect x="328" y="342" width="80" height="24" rx="12" fill="#dbeafe"/>
    <text x="368" y="358" text-anchor="middle">prompts</text>
    <rect x="418" y="342" width="90" height="24" rx="12" fill="#dbeafe"/>
    <text x="463" y="358" text-anchor="middle">resources</text>
  </g>
  <text x="528" y="359" font-size="11.5" fill="#94a3b8">circuit breaker per upstream · catalog refreshed on a schedule</text>

  <!-- fan out -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 500 388 L 500 408 L 250 408 L 250 452"/>
    <path d="M 500 388 L 500 452"/>
    <path d="M 500 388 L 500 408 L 750 408 L 750 452"/>
  </g>

  <text x="500" y="576" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.4">YOUR EXISTING MCP SERVERS</text>

  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="160" y="452" width="180" height="88" rx="10"/>
    <rect x="410" y="452" width="180" height="88" rx="10"/>
    <rect x="660" y="452" width="180" height="88" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="250" y="480" font-size="14.5" font-weight="600">GitHub MCP</text>
    <text x="500" y="480" font-size="14.5" font-weight="600">Database MCP</text>
    <text x="750" y="480" font-size="14.5" font-weight="600">Internal MCP</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="250" y="503">github__searchCode</text>
    <text x="250" y="521">github__createPullRequest</text>
    <text x="500" y="503">database__query</text>
    <text x="500" y="521">database__delete</text>
    <text x="750" y="503">internal__lookup</text>
    <text x="750" y="521">internal__notify</text>
  </g>
</svg>
